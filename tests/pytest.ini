[pytest]
filterwarnings =
    ignore::DeprecationWarning:fastapi.applications
    ignore::DeprecationWarning:main
    ignore:.*datetime.datetime.utcnow.*
    ignore:.*The HMAC key is 20 bytes long.*
    ignore:.*The parameter 'pretrained' is deprecated.*
    ignore:.*Arguments other than a weight enum.*
    ignore:.*You have both PyFPDF & fpdf2 installed.*
    ignore:.*Substituting font arial by core font helvetica.*
    ignore:.*The parameter "ln" is deprecated.*
    ignore:.*"dest" parameter is deprecated.*
